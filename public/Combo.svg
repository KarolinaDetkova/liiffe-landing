      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#1F2C49" flood-opacity="0.14"></feDropShadow>
    </filter>
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.40"></feDropShadow>
    </filter>
