  <text x="1130" y="322" text-anchor="middle" font-size="16.5" font-weight="700" letter-spacing="0.5" fill="#FF008C">INGRESOS</text>
  <text x="1130" y="348" text-anchor="middle" font-size="13" fill="#6B7387"><tspan x="1130" dy="0">Más valor por huésped y</tspan><tspan x="1130" dy="16">mejores resultados para</tspan><tspan x="1130" dy="16">tu alojamiento.</tspan></text>

  
  <rect x="0" y="430" width="1280" height="420" fill="#0E1A33"></rect>
  <rect x="0" y="430" width="1280" height="420" fill="url(#darkGlow)"></rect>
  <rect x="0" y="430" width="1280" height="3" fill="url(#gTitle)"></rect>

  <text x="640" y="512" text-anchor="middle" font-size="34" font-weight="800" letter-spacing="0.2">
