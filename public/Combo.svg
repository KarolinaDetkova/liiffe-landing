  </text>

  
  <rect x="40" y="566" width="219" height="224" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"></rect>
  <rect x="124" y="590" width="50" height="50" rx="14" fill="#FFE0F0"></rect>
  <g transform="translate(135,601) scale(1.16)" fill="none" stroke="#FF008C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></g>
  <text x="149" y="682" text-anchor="middle" font-size="15" font-weight="700" fill="#0E1626"><tspan x="149" dy="0">Incrementa el gasto</tspan><tspan x="149" dy="18">por huésped</tspan></text>
  <text x="149" y="730" text-anchor="middle" font-size="12.5" fill="#6B7387"><tspan x="149" dy="0">Recomendaciones y ofertas</tspan><tspan x="149" dy="16">personalizadas que aumentan</tspan><tspan x="149" dy="16">el ticket medio.</tspan></text>

  
