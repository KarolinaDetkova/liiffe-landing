  <text x="875" y="322" text-anchor="middle" font-size="16.5" font-weight="700" letter-spacing="0.5" fill="#10B981">SOSTENIBILIDAD</text>
  <text x="875" y="348" text-anchor="middle" font-size="13" fill="#6B7387"><tspan x="875" dy="0">Optimizamos recursos</tspan><tspan x="875" dy="16">y operaciones para un hotel</tspan><tspan x="875" dy="16">más eficiente y rentable.</tspan></text>

  
  <circle cx="1130" cy="230" r="64" fill="none" stroke="#FF008C" stroke-opacity="0.12" stroke-width="7"></circle>
  <circle cx="1130" cy="230" r="54" fill="#FFFFFF" stroke="#FF008C" stroke-width="2.6" filter="url(#soft)"></circle>
