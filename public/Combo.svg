  <text x="150" y="322" text-anchor="middle" font-size="16.5" font-weight="700" letter-spacing="0.5" fill="#FF008C">DATA</text>
  <text x="150" y="348" text-anchor="middle" font-size="13" fill="#6B7387"><tspan x="150" dy="0">Todos los datos de</tspan><tspan x="150" dy="16">tus huéspedes</tspan><tspan x="150" dy="16">en un solo lugar.</tspan></text>

  
  <circle cx="405" cy="230" r="64" fill="none" stroke="#862BF4" stroke-opacity="0.12" stroke-width="7"></circle>
  <circle cx="405" cy="230" r="54" fill="#FFFFFF" stroke="#862BF4" stroke-width="2.6" filter="url(#soft)"></circle>
  <g transform="translate(390,215) scale(1.25)" fill="none" stroke="#862BF4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"></rect><rect x="9" y="9" width="6" height="6" rx="1"></rect><path d="M15 2v2"></path><path d="M15 20v2"></path><path d="M2 15h2"></path><path d="M2 9h2"></path><path d="M20 15h2"></path><path d="M20 9h2"></path><path d="M9 2v2"></path><path d="M9 20v2"></path></g>
  <text x="405" y="322" text-anchor="middle" font-size="16.5" font-weight="700" letter-spacing="0.5" fill="#862BF4">INTELIGENCIA</text>
  <text x="405" y="348" text-anchor="middle" font-size="13" fill="#6B7387"><tspan x="405" dy="0">Convertimos datos en</tspan><tspan x="405" dy="16">información accionable</tspan><tspan x="405" dy="16">para decidir mejor.</tspan></text>

  
  <circle cx="640" cy="230" r="64" fill="none" stroke="#5C74FF" stroke-opacity="0.12" stroke-width="7"></circle>
