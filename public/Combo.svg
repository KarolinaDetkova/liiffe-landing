  <text x="640" y="322" text-anchor="middle" font-size="16.5" font-weight="700" letter-spacing="0.5" fill="#5C74FF">PERSONALIZACIÓN</text>
  <text x="640" y="348" text-anchor="middle" font-size="13" fill="#6B7387"><tspan x="640" dy="0">Creamos experiencias</tspan><tspan x="640" dy="16">únicas para cada huésped,</tspan><tspan x="640" dy="16">en el momento perfecto.</tspan></text>

  
  <circle cx="875" cy="230" r="64" fill="none" stroke="#10B981" stroke-opacity="0.12" stroke-width="7"></circle>
