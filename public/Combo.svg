  <rect x="614" y="590" width="50" height="50" rx="14" fill="#E0F6FF"></rect>
  <g transform="translate(625,601) scale(1.16)" fill="none" stroke="#06BFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></g>
  <text x="639" y="682" text-anchor="middle" font-size="15" font-weight="700" fill="#0E1626"><tspan x="639" dy="0">Mejora la experiencia</tspan><tspan x="639" dy="18">del huésped</tspan></text>
  <text x="639" y="730" text-anchor="middle" font-size="12.5" fill="#6B7387"><tspan x="639" dy="0">Información relevante en el</tspan><tspan x="639" dy="16">momento adecuado para</tspan><tspan x="639" dy="16">cada cliente.</tspan></text>

  
  <rect x="775" y="566" width="219" height="224" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"></rect>
  <rect x="859" y="590" width="50" height="50" rx="14" fill="#EEE1FD"></rect>
  <g transform="translate(870,601) scale(1.16)" fill="none" stroke="#862BF4" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></g>
  <text x="884" y="682" text-anchor="middle" font-size="15" font-weight="700" fill="#0E1626"><tspan x="884" dy="0">Aumenta la fidelización</tspan><tspan x="884" dy="18">y la repetición</tspan></text>
  <text x="884" y="730" text-anchor="middle" font-size="12.5" fill="#6B7387"><tspan x="884" dy="0">Los huéspedes vuelven</tspan><tspan x="884" dy="16">cuando sienten que los</tspan><tspan x="884" dy="16">conocemos.</tspan></text>

  
  <rect x="1020" y="566" width="219" height="224" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"></rect>
  <rect x="1104" y="590" width="50" height="50" rx="14" fill="#FFE0F0"></rect>
  <g transform="translate(1115,601) scale(1.16)" fill="none" stroke="#FF008C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></g>
  <text x="1129" y="682" text-anchor="middle" font-size="15" font-weight="700" fill="#0E1626"><tspan x="1129" dy="0">Obtén una visión 360°</tspan><tspan x="1129" dy="18">de tus huéspedes</tspan></text>
  <text x="1129" y="730" text-anchor="middle" font-size="12.5" fill="#6B7387"><tspan x="1129" dy="0">Toda la información</tspan><tspan x="1129" dy="16">centralizada, segmentada y</tspan><tspan x="1129" dy="16">accionable en tiempo real.</tspan></text>

