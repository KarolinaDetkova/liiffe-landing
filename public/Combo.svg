  <rect x="369" y="590" width="50" height="50" rx="14" fill="#FFE0F0"></rect>
  <g transform="translate(380,601) scale(1.16)" fill="none" stroke="#FF008C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"></circle><circle cx="19" cy="21" r="1"></circle><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path></g>
  <text x="394" y="682" text-anchor="middle" font-size="15" font-weight="700" fill="#0E1626"><tspan x="394" dy="0">Impulsa la venta de</tspan><tspan x="394" dy="18">servicios</tspan></text>
  <text x="394" y="730" text-anchor="middle" font-size="12.5" fill="#6B7387"><tspan x="394" dy="0">Más reservas de restaurante,</tspan><tspan x="394" dy="16">spa, actividades, upgrades</tspan><tspan x="394" dy="16">y experiencias.</tspan></text>

  
