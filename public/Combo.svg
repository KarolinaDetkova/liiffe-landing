    <circle cx="1180" cy="47" r="3"></circle><circle cx="1205" cy="47" r="3"></circle><circle cx="1230" cy="47" r="3"></circle><circle cx="1255" cy="47" r="3"></circle>
    <circle cx="1205" cy="72" r="3"></circle><circle cx="1230" cy="72" r="3"></circle><circle cx="1255" cy="72" r="3"></circle>
    <circle cx="1230" cy="97" r="3"></circle><circle cx="1255" cy="97" r="3"></circle>
