<svg width="1280" height="850" viewBox="0 0 1280 850" xmlns="http://www.w3.org/2000/svg" font-family="&#39;Geist&#39;,&#39;ABC Diatype&#39;,&#39;Helvetica Neue&#39;,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#F5F5F9"></stop>
    </linearGradient>
    <linearGradient id="gTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF008C"></stop><stop offset="0.5" stop-color="#862BF4"></stop><stop offset="1" stop-color="#06BFFF"></stop>
    </linearGradient>
    <radialGradient id="darkGlow" cx="0.5" cy="0.0" r="0.8">
      <stop offset="0" stop-color="#5C74FF" stop-opacity="0.16"></stop><stop offset="1" stop-color="#5C74FF" stop-opacity="0"></stop>
    </radialGradient>
