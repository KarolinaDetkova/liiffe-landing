  <text x="640" y="66" text-anchor="middle" font-size="52" font-weight="800" letter-spacing="0.5">
    <tspan fill="#1F2C49">EL COMBO </tspan><tspan fill="url(#gTitle)">LIIFFE</tspan>
  </text>
  <text x="640" y="106" text-anchor="middle" font-size="20" font-weight="400" fill="#6B7387">Nuestra fórmula para convertir datos en ingresos.</text>

  <g font-size="46" font-weight="700" fill="#3A4256" text-anchor="middle">
    <text x="277" y="247">+</text><text x="522" y="247">+</text><text x="757" y="247">+</text><text x="1002" y="247">=</text>
  </g>

  
  <circle cx="150" cy="230" r="64" fill="none" stroke="#FF008C" stroke-opacity="0.12" stroke-width="7"></circle>
  <circle cx="150" cy="230" r="54" fill="#FFFFFF" stroke="#FF008C" stroke-width="2.6" filter="url(#soft)"></circle>
